name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc_admin
          POSTGRES_PASSWORD: soc_admin_ci
          POSTGRES_DB: soc_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: Black format check
        working-directory: backend
        run: black --check app tests

      - name: Run tests (pytest, with coverage)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://soc_admin:soc_admin_ci@localhost:5432/soc_workbench_test
          LLM_PROVIDER: mock
          TI_USE_LIVE_PROVIDERS: "false"
          AUTH_SINGLE_USER_MODE: "true"
        run: pytest -q --cov=app --cov-report=term-missing

      - name: pip-audit (dependency vulnerability scan)
        working-directory: backend
        run: pip-audit || true # advisory only — see SECURITY.md for tracked/accepted risks

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: npm audit (dependency vulnerability scan)
        working-directory: frontend
        run: npm audit --audit-level=critical || true # advisory only — see SECURITY.md

  alembic-migration-check:
    name: Alembic migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc_admin
          POSTGRES_PASSWORD: soc_admin_ci
          POSTGRES_DB: soc_workbench_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://soc_admin:soc_admin_ci@localhost:5432/soc_workbench_migration_check
        run: alembic upgrade head
